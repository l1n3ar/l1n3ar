<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Lora, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b3d2e" />
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b3d2e" fill-opacity="0.55" />
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#f6f1e4" />

  <!-- Apps / Orchestrator -->
  <rect x="24" y="150" width="180" height="80" rx="2" fill="none" stroke="#0b3d2e" stroke-width="1.5" />
  <text x="114" y="185" text-anchor="middle" fill="#1b2420" font-size="15" font-style="italic">chat apps &amp;</text>
  <text x="114" y="205" text-anchor="middle" fill="#1b2420" font-size="15" font-style="italic">orchestrators</text>

  <!-- Gateway -->
  <rect x="340" y="130" width="220" height="120" rx="2" fill="#0b3d2e" />
  <text x="450" y="168" text-anchor="middle" fill="#f6f1e4" font-size="17" font-style="italic">gateway</text>
  <text x="450" y="195" text-anchor="middle" fill="#f6f1e4" font-size="12" opacity="0.85">model routing</text>
  <text x="450" y="213" text-anchor="middle" fill="#f6f1e4" font-size="12" opacity="0.85">audit + compliance log</text>
  <text x="450" y="231" text-anchor="middle" fill="#f6f1e4" font-size="12" opacity="0.85">policy enforcement</text>

  <!-- Model providers -->
  <rect x="672" y="24" width="204" height="86" rx="2" fill="none" stroke="#0b3d2e" stroke-width="1.5" />
  <text x="774" y="52" text-anchor="middle" fill="#1b2420" font-size="14" font-style="italic">model providers</text>
  <text x="774" y="70" text-anchor="middle" fill="#1b2420" font-size="10.5" opacity="0.75">openai · anthropic</text>
  <text x="774" y="86" text-anchor="middle" fill="#1b2420" font-size="10.5" opacity="0.75">azure openai · gemini · …</text>
  <text x="774" y="102" text-anchor="middle" fill="#1b2420" font-size="10" opacity="0.6">(bring-your-own keys)</text>

  <!-- Tool / MCP layer -->
  <rect x="672" y="270" width="204" height="86" rx="2" fill="none" stroke="#0b3d2e" stroke-width="1.5" />
  <text x="774" y="298" text-anchor="middle" fill="#1b2420" font-size="14" font-style="italic">tool / mcp layer</text>
  <text x="774" y="316" text-anchor="middle" fill="#1b2420" font-size="10.5" opacity="0.75">sec edgar · uspto</text>
  <text x="774" y="332" text-anchor="middle" fill="#1b2420" font-size="10.5" opacity="0.75">unicourt · congress · …</text>

  <!-- Human approval checkpoint -->
  <rect x="380" y="290" width="180" height="64" rx="2" fill="none" stroke="#0b3d2e" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="470" y="316" text-anchor="middle" fill="#1b2420" font-size="13" font-style="italic">human approval</text>
  <text x="470" y="334" text-anchor="middle" fill="#1b2420" font-size="10" opacity="0.7">gated tools only</text>

  <!-- Arrows -->
  <path d="M204,190 L338,190" stroke="#0b3d2e" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <path d="M470,130 L520,110 L670,80" stroke="#0b3d2e" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <path d="M470,250 L520,270 L670,306" stroke="#0b3d2e" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <path d="M672,322 L562,322" stroke="#0b3d2e" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="3 3" marker-end="url(#arrow-dash)" />
  <path d="M470,290 L470,257" stroke="#0b3d2e" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="3 3" marker-end="url(#arrow-dash)" />

  <text x="450" y="20" text-anchor="middle" fill="#0b3d2e" font-size="12" font-style="italic" opacity="0.7">every call routes through one gateway — every gated tool call waits on a human</text>
</svg>
